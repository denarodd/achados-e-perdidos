<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achados e Perdidos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#e4e7ec;--pri:#2457d6;--pri2:#e8eefc;--ok:#157f4b;--warn:#b54708;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b1f2a;--tx:#eef1f6;--mut:#9aa3b5;--bd:#2c3242;--pri:#6c93ff;--pri2:#222c4a;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
h1{font-size:20px;margin:0}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button:hover{filter:brightness(.96)}
nav{display:flex;gap:4px}
nav button{border:0;background:none;border-bottom:3px solid transparent;border-radius:0;color:var(--mut)}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
#banner{background:#fff4e5;color:#7a4100;padding:8px 16px;font-size:13px;display:none;text-align:center}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:100%}
.bar input{flex:1;min-width:180px;width:auto}.bar select{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border-radius:999px;padding:5px 13px;font-size:13px}
.chip.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:140px;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:44px}
.ph img{width:100%;height:100%;object-fit:cover}
.cb{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{margin:0;font-size:16px}.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:600;background:var(--pri2);color:var(--pri)}
.tag.achado{background:#e3f6ec;color:var(--ok)}.tag.perdido{background:#fdeceb;color:var(--bad)}
.tag.pendente{background:#fff1dc;color:var(--warn)}.tag.aprovada{background:#e3f6ec;color:var(--ok)}.tag.recusada{background:#fdeceb;color:var(--bad)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .act{margin-top:auto;padding-top:8px}
.empty{text-align:center;color:var(--mut);padding:50px 0;grid-column:1/-1}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--tx)}
dialog::backdrop{background:#0008}
form{padding:20px;display:grid;gap:12px}form h2{margin:0;font-size:18px}
label{font-size:13px;color:var(--mut);display:grid;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}
th{color:var(--mut);font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto;padding-bottom:40px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:20}
</style>
</head>
<body>
<header>
 <div class="wrap top">
  <h1>🔎 Achados e Perdidos</h1>
  <nav>
   <button id="t-itens" class="on" onclick="tab('itens')">Objetos</button>
   <button id="t-sol" onclick="tab('sol')">Solicitações</button>
  </nav>
  <button class="pri" onclick="abrirCadastro()">+ Cadastrar objeto</button>
 </div>
</header>
<div id="banner"></div>

<main class="wrap">
 <section id="v-itens">
  <div class="bar">
   <input id="q" placeholder="Buscar por nome, descrição ou local…" oninput="renderItens()">
   <select id="fs" onchange="renderItens()">
    <option value="">Todos</option><option value="achado">Achados</option><option value="perdido">Perdidos</option><option value="devolvido">Devolvidos</option>
   </select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
 </section>
 <section id="v-sol" style="display:none">
  <div class="bar"><h2 style="margin:0;font-size:18px">Solicitações de devolução</h2></div>
  <div class="tw"><table><thead><tr><th>Objeto</th><th>Solicitante</th><th>Contato</th><th>Mensagem</th><th>Data</th><th>Status</th><th></th></tr></thead><tbody id="sol"></tbody></table></div>
 </section>
</main>

<dialog id="dCad"><form onsubmit="salvarItem(event)">
 <h2>Cadastrar objeto</h2>
 <label>Nome do objeto*<input name="nome" required maxlength="80"></label>
 <div class="two">
  <label>Categoria*<select name="categoria" id="selCat" required></select></label>
  <label>Situação*<select name="status"><option value="achado">Achado</option><option value="perdido">Perdido</option></select></label>
 </div>
 <label>Descrição<textarea name="descricao" rows="3"></textarea></label>
 <div class="two">
  <label>Local*<input name="local" required></label>
  <label>Data e hora*<input type="datetime-local" name="data" required></label>
 </div>
 <label>URL da foto (opcional)<input name="foto" type="url" placeholder="https://…"></label>
 <label>Contato de quem registrou<input name="contato" placeholder="e-mail ou telefone"></label>
 <div class="foot"><button type="button" onclick="dCad.close()">Cancelar</button><button class="pri">Salvar</button></div>
</form></dialog>

<dialog id="dSol"><form onsubmit="salvarSolic(event)">
 <h2>Solicitar devolução</h2>
 <div class="mut" id="solItem"></div>
 <input type="hidden" name="item_id">
 <label>Seu nome*<input name="solicitante" required></label>
 <label>Contato*<input name="contato" required placeholder="e-mail ou telefone"></label>
 <label>Como comprovar que é seu?*<textarea name="mensagem" rows="3" required placeholder="Descreva características, marcas, conteúdo…"></textarea></label>
 <div class="foot"><button type="button" onclick="dSol.close()">Cancelar</button><button class="pri">Enviar solicitação</button></div>
</form></dialog>
<div id="toast"></div>

<script>
/* ============ CONFIGURAÇÃO DA API (ajuste aqui) ============ */
// servido pelo server.py -> "/api"; aberto direto do arquivo -> localhost:8080
const API_BASE = location.protocol === "file:" ? "http://localhost:8080/api" : "/api";
const ENDPOINTS = {
  itens: "/itens",              // GET (?categoria=&status=&q=), POST
  item: id => `/itens/${id}`,   // PATCH {status}
  solicitacoes: "/devolucoes",  // GET, POST {item_id, solicitante, contato, mensagem}
  solicitacao: id => `/devolucoes/${id}` // PATCH {status}
};
// valor enviado à API (slug) -> rótulo e ícone exibidos
const CATS = {
  documentos:{l:"Documentos",i:"🪪"}, eletronicos:{l:"Eletrônicos",i:"📱"}, roupas:{l:"Roupas",i:"🧥"},
  acessorios:{l:"Acessórios",i:"👓"}, chaves:{l:"Chaves",i:"🔑"}, bolsas_mochilas:{l:"Bolsas e mochilas",i:"🎒"}, outros:{l:"Outros",i:"📦"}
};
const catL = c => (CATS[c]||{l:c}).l, catI = c => (CATS[c]||{i:"📦"}).i;
const fmt = d => { const x=new Date(d); return isNaN(x)?esc(d):x.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}); };
/* ============================================================ */

let demo = false, itens = [], solics = [], catAtiva = "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---- camada de dados: API real com fallback local ---- */
const LS = {get:k=>JSON.parse(localStorage.getItem(k)||"null"),set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
function seed(){
  if(LS.get("ap_itens2")) return;
  const D="2026-11-09T", Z=":00-03:00";
  const base=[
   ["Fone de ouvido Bluetooth","Fone sem fio branco, acompanhado de estojo de carregamento.","eletronicos","Biblioteca, mesa próxima à janela.","08:15"],
   ["Garrafa térmica","Garrafa térmica azul-escura, com adesivo de estrela na lateral.","outros","Quadra esportiva.","09:30"],
   ["Mochila preta","Mochila preta com três compartimentos e chaveiro de dinossauro.","bolsas_mochilas","Corredor do segundo andar.","10:00"],
   ["Carteira marrom","Carteira de couro sintético marrom, contendo cartões sem identificação visível.","acessorios","Cantina, próxima ao caixa.","10:45"],
   ["Casaco de moletom","Casaco cinza com capuz, tamanho médio e bolso frontal.","roupas","Sala 12.","11:20"],
   ["Chaveiro com chaves","Argola metálica com três chaves e um chaveiro vermelho.","chaves","Estacionamento, próximo ao portão principal.","12:10"],
   ["Óculos de grau","Óculos de armação preta, com estojo rígido azul.","acessorios","Laboratório de informática.","12:40"],
   ["Carregador de celular","Carregador branco com cabo USB-C.","eletronicos","Sala de estudos.","13:00"],
   ["Guarda-chuva","Guarda-chuva dobrável preto, com cabo emborrachado.","outros","Recepção.","13:25"],
   ["Caderno universitário","Caderno de capa vermelha, com anotações de matemática nas primeiras páginas.","outros","Sala 08.","13:50"],
   ["Relógio de pulso","Relógio digital preto com pulseira de borracha.","acessorios","Banheiro do bloco B.","14:05"],
   ["Pen drive","Pen drive de 32 GB, vermelho e preto, com tampa.","eletronicos","Laboratório de informática, computador 06.","14:20"],
   ["Boné azul","Boné azul-marinho com símbolo branco na parte frontal.","roupas","Arquibancada da quadra.","14:35"],
   ["Documento de identificação","Documento encontrado dentro de um envelope transparente. Dados pessoais preservados.","documentos","Secretaria acadêmica.","14:50"],
   ["Bolsa feminina","Bolsa pequena bege, com alça ajustável e fecho dourado.","bolsas_mochilas","Auditório principal.","15:00"]
  ];
  LS.set("ap_itens2",base.map((b,k)=>({id:k+1,nome:b[0],descricao:b[1],categoria:b[2],local:b[3],data:D+b[4]+Z,status:"achado",foto:"",contato:""})));
  LS.set("ap_sol2",[]);
}
async function req(path,opt={}){
  const r=await fetch(API_BASE+path,{headers:{"Content-Type":"application/json"},...opt});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.status===204?null:r.json();
}
const list = d => Array.isArray(d)?d:(d.content||d.items||d.data||[]);
async function api(kind,...a){
  if(!demo){
    try{
      if(kind==="getItens") return list(await req(ENDPOINTS.itens));
      if(kind==="getSol") return list(await req(ENDPOINTS.solicitacoes));
      if(kind==="addItem") return await req(ENDPOINTS.itens,{method:"POST",body:JSON.stringify(a[0])});
      if(kind==="addSol") return await req(ENDPOINTS.solicitacoes,{method:"POST",body:JSON.stringify(a[0])});
      if(kind==="setItem") return await req(ENDPOINTS.item(a[0]),{method:"PATCH",body:JSON.stringify({status:a[1]})});
      if(kind==="setSol") return await req(ENDPOINTS.solicitacao(a[0]),{method:"PATCH",body:JSON.stringify({status:a[1]})});
    }catch(e){
      if(kind==="getItens"){ demo=true; seed(); $("banner").style.display="block";
        $("banner").textContent="API indisponível em "+API_BASE+" — modo demonstração (dados salvos só neste navegador).";
      } else throw e;
    }
  }
  const I=LS.get("ap_itens2")||[],S=LS.get("ap_sol2")||[],nid=l=>Math.max(0,...l.map(x=>x.id))+1;
  if(kind==="getItens") return I;
  if(kind==="getSol") return S;
  if(kind==="addItem"){const o={...a[0],id:nid(I)};I.push(o);LS.set("ap_itens2",I);return o}
  if(kind==="addSol"){const o={...a[0],id:nid(S),status:"pendente",data:new Date().toISOString()};S.push(o);LS.set("ap_sol2",S);return o}
  if(kind==="setItem"){const o=I.find(x=>x.id==a[0]);o.status=a[1];LS.set("ap_itens2",I)}
  if(kind==="setSol"){const o=S.find(x=>x.id==a[0]);o.status=a[1];LS.set("ap_sol2",S)}
}

/* ---- UI ---- */
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2800)}
function tab(t){
  $("v-itens").style.display=t==="itens"?"":"none";$("v-sol").style.display=t==="sol"?"":"none";
  $("t-itens").classList.toggle("on",t==="itens");$("t-sol").classList.toggle("on",t==="sol");
  if(t==="sol") carregarSol();
}
function renderChips(){
  const cats=["",...Object.keys(CATS)];
  $("chips").innerHTML=cats.map(c=>`<button class="chip ${c===catAtiva?"on":""}" onclick="catAtiva='${c}';renderChips();renderItens()">${c?catI(c)+" "+catL(c):"Todas"}</button>`).join("");
}
function renderItens(){
  const q=$("q").value.toLowerCase(),fs=$("fs").value;
  const f=itens.filter(i=>(!catAtiva||i.categoria===catAtiva)&&(!fs||i.status===fs)&&(fs||i.status!=="devolvido")
    &&(!q||[i.nome,i.descricao,i.local].join(" ").toLowerCase().includes(q)));
  $("grid").innerHTML=f.length?f.map(i=>`
   <article class="card"><div class="ph">${i.foto?`<img src="${esc(i.foto)}" alt="" onerror="this.replaceWith('${catI(i.categoria)}')">`:catI(i.categoria)}</div>
    <div class="cb"><div class="row"><span class="tag ${esc(i.status)}">${esc(i.status)}</span><span class="tag">${esc(catL(i.categoria))}</span></div>
     <h3>${esc(i.nome)}</h3><div class="mut">${esc(i.descricao)}</div>
     <div class="mut">📍 ${esc(i.local)} · ${fmt(i.data)}</div>
     <div class="act">${i.status==="devolvido"?"":`<button class="pri" onclick="abrirSolic(${i.id})">Solicitar devolução</button>`}</div></div></article>`).join("")
   :`<div class="empty">Nenhum objeto encontrado.</div>`;
}
async function carregar(){
  try{itens=await api("getItens")}catch(e){itens=[];toast("Erro ao carregar objetos")}
  renderItens();
}
async function carregarSol(){
  try{solics=await api("getSol")}catch(e){solics=[];toast("Erro ao carregar solicitações")}
  const nome=id=>(itens.find(i=>i.id==id)||{}).nome||("#"+id);
  $("sol").innerHTML=solics.length?solics.slice().reverse().map(s=>`<tr>
   <td>${esc(s.item?.nome||nome(s.item_id))}</td><td>${esc(s.solicitante)}</td><td>${esc(s.contato)}</td><td>${esc(s.mensagem)}</td>
   <td>${esc(String(s.data||"").slice(0,10))}</td><td><span class="tag ${esc(s.status)}">${esc(s.status)}</span></td>
   <td>${s.status==="pendente"?`<div class="row"><button onclick="decidir(${s.id},${s.item_id},'aprovada')">Aprovar</button><button onclick="decidir(${s.id},${s.item_id},'recusada')">Recusar</button></div>`:""}</td></tr>`).join("")
   :`<tr><td colspan="7" class="empty">Nenhuma solicitação registrada.</td></tr>`;
}
async function decidir(id,itemId,st){
  try{
    await api("setSol",id,st);
    if(st==="aprovada") await api("setItem",itemId,"devolvido");
    toast("Solicitação "+st);await carregar();carregarSol();
  }catch(e){toast("Erro ao atualizar")}
}
function abrirCadastro(){
  $("selCat").innerHTML=Object.keys(CATS).map(c=>`<option value="${c}">${catL(c)}</option>`).join("");
  dCad.querySelector("form").reset();
  const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());
  dCad.querySelector("[name=data]").value=n.toISOString().slice(0,16);
  dCad.showModal();
}
async function salvarItem(e){
  e.preventDefault();
  try{
    await api("addItem",Object.fromEntries(new FormData(e.target)));
    dCad.close();toast("Objeto cadastrado!");await carregar();
  }catch(err){toast("Erro ao cadastrar objeto")}
}
function abrirSolic(id){
  const i=itens.find(x=>x.id==id);
  dSol.querySelector("form").reset();
  dSol.querySelector("[name=item_id]").value=id;
  $("solItem").textContent="Objeto: "+i.nome+" — "+i.local;
  dSol.showModal();
}
async function salvarSolic(e){
  e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target));d.item_id=Number(d.item_id);
  try{await api("addSol",d);dSol.close();toast("Solicitação registrada! Aguarde o contato.")}
  catch(err){toast("Erro ao enviar solicitação")}
}
renderChips();carregar();
</script>
</body>
</html>
